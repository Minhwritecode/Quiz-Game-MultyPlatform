server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression for JS, CSS, JSON, SVG, WASM, and 3D GLB assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm model/gltf-binary;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Expo Router SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Correct MIME type for Blender Draco GLB 3D models
  location ~* \.glb$ {
    types { model/gltf-binary glb; }
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Static immutable assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|ttf|mp3|wav|wasm)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
