name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Architecture boundary check
        run: ./scripts/check_architecture.sh
      - name: Web build smoke test
        run: flutter build web --release --dart-define=APP_ENV=ci

