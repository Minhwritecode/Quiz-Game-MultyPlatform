name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install React Native dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci --coverage
      - name: Release guard tests
        run: node --test scripts/release.test.cjs
      - name: Architecture boundary check
        run: ./scripts/check_architecture.sh
      - name: Web build smoke test
        run: npx --no-install expo export --platform web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: coverage/
          retention-days: 14
