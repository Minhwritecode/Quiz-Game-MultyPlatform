name: OTA update
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [preview, production]
        default: preview
      message:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ota-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  update:
    needs: quality
    environment: ${{ inputs.channel }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      APP_VARIANT: ${{ inputs.channel }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Export update with the same EAS environment as the binary
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: npx --no-install eas update --channel "$APP_VARIANT" --environment "$APP_VARIANT" --message "$UPDATE_MESSAGE" --non-interactive
      - name: Upload matching source maps
        if: env.SENTRY_ORG != ''
        run: npx --no-install sentry-expo-upload-sourcemaps dist
