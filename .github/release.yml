changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: New Features
      labels:
        - enhancement
        - feature
    - title: Performance & Optimizations
      labels:
        - performance
        - optimization
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Documentation & Maintenance
      labels:
        - documentation
        - chore
    - title: Other Changes
      labels:
        - "*"
