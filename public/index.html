<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="Papyrus — From Ancient Scroll to AI Power. AI Quiz Generation, Papybot RAG Tutor & 3D Gamified Study Arena."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F3E8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12151F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Papyrus" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset + full dynamic viewport height for iOS Safari / PWA -->
    <style id="expo-reset">
      :root {
        color-scheme: light dark;
        --papyrus-canvas-bg: #F7F3E8;
        --papyrus-spinner-accent: #1C3F94;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --papyrus-canvas-bg: #12151F;
          --papyrus-spinner-accent: #7BA4FF;
        }
      }
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: var(--papyrus-canvas-bg);
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100dvh;
        flex: 1;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      /* Smooth interactive micro-transitions on Web */
      [role="button"],
      [role="tab"],
      [role="link"] {
        transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
          opacity 160ms ease,
          background-color 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }
      @media (prefers-reduced-motion: reduce) {
        [role="button"],
        [role="tab"],
        [role="link"] {
          transition: none !important;
        }
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation-duration: 210ms;
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
        }
      }

      /* Indeterminate accessible conic-gradient spinner (<progress>) */
      progress.papyrus-spinner:indeterminate::-webkit-progress-bar,
      progress.papyrus-spinner:indeterminate::-webkit-progress-value,
      progress.papyrus-spinner:indeterminate::-moz-progress-bar {
        display: none;
        background: none;
      }
      @keyframes papyrus-spin {
        to {
          transform: rotate(1turn);
        }
      }
      progress.papyrus-spinner:indeterminate {
        --size: 64px;
        --thickness: 3px;
        --spinner-color: var(--papyrus-spinner-accent);
        --track-color: rgba(148, 163, 184, 0.18);
        --_used-spinner-duration: 1.15s;
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        border: 0;
        appearance: none;
        -webkit-appearance: none;
        background: conic-gradient(from 90deg, transparent 0deg, rgba(6, 182, 212, 0.45) 110deg, var(--spinner-color) 310deg, transparent 360deg) var(--track-color);
        -webkit-mask-image: radial-gradient(farthest-side, transparent calc(100% - var(--thickness)), #000 calc(100% - var(--thickness)));
        mask-image: radial-gradient(farthest-side, transparent calc(100% - var(--thickness)), #000 calc(100% - var(--thickness)));
        animation: papyrus-spin var(--_used-spinner-duration) linear infinite;
      }
      @media (forced-colors: active) {
        progress.papyrus-spinner:indeterminate {
          forced-color-adjust: none;
          --spinner-color: CanvasText;
          --track-color: Canvas;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        progress.papyrus-spinner:indeterminate {
          --_used-spinner-duration: 6s;
        }
      }

      /* Native <dialog> scroll containment */
      dialog:modal {
        overscroll-behavior: contain;
      }
      dialog::backdrop {
        overflow: hidden;
        overscroll-behavior: contain;
        background: rgba(4, 8, 28, 0.72);
        backdrop-filter: blur(8px);
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Papyrus.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
