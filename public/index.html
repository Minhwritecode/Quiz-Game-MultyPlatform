<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="Papyrus — From Ancient Scroll to AI Power. AI Quiz Generation, Papybot RAG Tutor & 3D Gamified Study Arena."
    />
    <meta name="theme-color" content="#060A24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Papyrus" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset + full dynamic viewport height for iOS Safari / PWA -->
    <style id="expo-reset">
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: #060a24;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100dvh;
        flex: 1;
      }
      /* Smooth interactive micro-transitions on Web */
      [role="button"],
      [role="tab"],
      [role="link"] {
        transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
          opacity 160ms ease,
          background-color 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }
      @media (prefers-reduced-motion: reduce) {
        [role="button"],
        [role="tab"],
        [role="link"] {
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Papyrus.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
